<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Stock Finished Goods</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📦 Monitoring Stock Gudang (FG)</span>
            <button class="btn btn-outline-light btn-sm" onclick="resetData()">Reset Semua Data</button>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Baris Form Input (3 Pilar Utama) -->
        <div class="row g-4 mb-4">
            
            <!-- 1. Input Stock Opname -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-primary">
                    <div class="card-header bg-primary text-white fw-bold">1. Set / Stock Opname Awal</div>
                    <div class="card-body">
                        <form id="formOpname" onsubmit="saveOpname(event)">
                            <div class="mb-2">
                                <label class="form-label small">SKU (Kode Barang)</label>
                                <input type="text" class="form-control form-control-sm" id="opSku" required placeholder="Contoh: KMP-BLK-L">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Nama Barang</label>
                                <input type="text" class="form-control form-control-sm" id="opName" required placeholder="Contoh: Kemeja Polos Hitam L">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Letak Blok Racking</label>
                                <input type="text" class="form-control form-control-sm" id="opRack" required placeholder="Contoh: Blok A - Rak 03">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small">Jumlah Fisik (Opname)</label>
                                <input type="number" class="form-control form-control-sm" id="opQty" required min="0" placeholder="0">
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm w-100">Simpan Opname</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 2. Input Hasil Produksi (Barang Masuk) -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-success">
                    <div class="card-header bg-success text-white fw-bold">2. Input Hasil Produksi (Masuk)</div>
                    <div class="card-body">
                        <form id="formIn" onsubmit="saveInbound(event)">
                            <div class="mb-2">
                                <label class="form-label small">Pilih Barang (SKU - Nama)</label>
                                <select class="form-select form-select-sm" id="inSku" required>
                                    <option value="">-- Pilih Barang --</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small">Jumlah Masuk (Produksi)</label>
                                <input type="number" class="form-control form-control-sm" id="inQty" required min="1" placeholder="0">
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100">Tambah Stok Masuk</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 3. Input Barang Keluar (Finished Goods) -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-danger">
                    <div class="card-header bg-danger text-white fw-bold">3. Input Barang Keluar (Kirim)</div>
                    <div class="card-body">
                        <form id="formOut" onsubmit="saveOutbound(event)">
                            <div class="mb-2">
                                <label class="form-label small">Pilih Barang (SKU - Nama)</label>
                                <select class="form-select form-select-sm" id="outSku" required>
                                    <option value="">-- Pilih Barang --</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small">Jumlah Keluar</label>
                                <input type="number" class="form-control form-control-sm" id="outQty" required min="1" placeholder="0">
                            </div>
                            <button type="submit" class="btn btn-danger btn-sm w-100">Keluarkan Barang</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>

        <!-- Tabel Monitoring Stok Real-Time -->
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold py-3">📊 Tabel Monitoring Stock Aktual di Gudang</div>
            <div class="card-body table-responsive">
                <table class="table table-bordered table-striped align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>No</th>
                            <th>SKU</th>
                            <th>Nama Barang</th>
                            <th>Letak Racking</th>
                            <th>Stock Opname (Awal)</th>
                            <th>Total Masuk (Produksi)</th>
                            <th>Total Keluar (Kirim)</th>
                            <th>Sisa Stock Aktual</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <!-- Data terisi otomatis via Javascript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript Logika & PWA Register -->
    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'))
            .catch(err => console.log('SW Registration Failed', err));
        }

        // Database Lokal menggunakan LocalStorage
        let stockData = JSON.parse(localStorage.getItem('stockDataFG_v2')) || {};

        function saveData() {
            localStorage.setItem('stockDataFG_v2', JSON.stringify(stockData));
            renderTable();
            updateDropdowns();
        }

        // 1. Simpan/Update Stock Opname (Baseline Awal)
        function saveOpname(e) {
            e.preventDefault();
            const sku = document.getElementById('opSku').value.trim();
            const name = document.getElementById('opName').value.trim();
            const rack = document.getElementById('opRack').value.trim();
            const qty = parseInt(document.getElementById('opQty').value);

            if (stockData[sku]) {
                // Update jika SKU sudah ada
                stockData[sku].name = name;
                stockData[sku].rack = rack;
                stockData[sku].opname = qty;
            } else {
                stockData[sku] = {
                    sku: sku,
                    name: name,
                    rack: rack,
                    opname: qty,
                    inProd: 0,
                    out: 0
                };
            }

            document.getElementById('formOpname').reset();
            saveData();
            alert('Stock Opname berhasil disimpan!');
        }

        // 2. Simpan Hasil Produksi (Barang Masuk)
        function saveInbound(e) {
            e.preventDefault();
            const sku = document.getElementById('inSku').value;
            const qty = parseInt(document.getElementById('inQty').value);

            if (!stockData[sku]) return;

            stockData[sku].inProd += qty;
            document.getElementById('formIn').reset();
            saveData();
            alert('Hasil produksi berhasil ditambahkan ke stok!');
        }

        // 3. Simpan Barang Keluar (Finished Goods)
        function saveOutbound(e) {
            e.preventDefault();
            const sku = document.getElementById('outSku').value;
            const qty = parseInt(document.getElementById('outQty').value);

            if (!stockData[sku]) return;

            // Hitung sisa stok berjalan saat ini
            const currentStock = (stockData[sku].opname + stockData[sku].inProd) - stockData[sku].out;
            
            if (qty > currentStock) {
                alert('Gagal! Jumlah keluar melebihi sisa stock aktual di gudang.');
                return;
            }

            stockData[sku].out += qty;
            document.getElementById('formOut').reset();
            saveData();
            alert('Barang keluar berhasil dicatat!');
        }

        // Render Tabel Monitoring
        function renderTable() {
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '';
            let no = 1;

            if (Object.keys(stockData).length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-muted py-3">Belum ada data stock. Silakan input Stock Opname terlebih dahulu.</td></tr>`;
                return;
            }

            for (let sku in stockData) {
                const item = stockData[sku];
                const sisa = (item.opname + item.inProd) - item.out;

                tbody.innerHTML += `
                    <tr>
                        <td>${no++}</td>
                        <td><span class="badge bg-secondary">${item.sku}</span></td>
                        <td class="text-start fw-semibold">${item.name}</td>
                        <td><span class="badge bg-info text-dark">${item.rack}</span></td>
                        <td>${item.opname}</td>
                        <td><span class="text-success fw-bold">+${item.inProd}</span></td>
                        <td><span class="text-danger fw-bold">-${item.out}</span></td>
                        <td><span class="badge fs-6 ${sisa > 0 ? 'bg-success' : 'bg-secondary'}">${sisa}</span></td>
                    </tr>
                `;
            }
        }

        // Update Pilihan Dropdown Barang Masuk & Keluar berdasarkan SKU
        function updateDropdowns() {
            const selectIn = document.getElementById('inSku');
            const selectOut = document.getElementById('outSku');
            
            selectIn.innerHTML = `<option value="">-- Pilih Barang --</option>`;
            selectOut.innerHTML = `<option value="">-- Pilih Barang --</option>`;

            for (let sku in stockData) {
                const item = stockData[sku];
                const optionText = `${item.sku} - ${item.name} (${item.rack})`;
                selectIn.innerHTML += `<option value="${sku}">${optionText}</option>`;
                selectOut.innerHTML += `<option value="${sku}">${optionText}</option>`;
            }
        }

        // Reset Data
        function resetData() {
            if (confirm('Yakin ingin menghapus seluruh data monitoring stock gudang?')) {
                localStorage.removeItem('stockDataFG_v2');
                stockData = {};
                renderTable();
                updateDropdowns();
            }
        }

        // Inisialisasi awal saat halaman dimuat
        renderTable();
        updateDropdowns();
    </script>
</body>
</html>
